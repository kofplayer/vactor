name: ci
on:
  push:
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24'

      - name: build
        run: go build ./...

      - name: vet
        run: go vet ./...

      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"

      - name: lint
        # 版本固定为 v2.13.2：本地已用它跑通（0 issues）。若写 latest，
        # CI 侧升级后新增的默认规则会变成"本地绿、CI 红"且难以本地复现。
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2

      - name: test (race + coverage)
        # 覆盖率只统计库代码：examples 与 testutil 不参与（它们 0% 会拉低整体口径）
        run: |
          pkgs=$(go list ./... | grep -v -E '/(examples|testutil)(/|$)')
          go test -race -timeout 10m -coverprofile=coverage.out $pkgs

      - name: coverage gate (>= 95%)
        run: |
          go tool cover -func=coverage.out | tail -1
          pct=$(go tool cover -func=coverage.out | tail -1 | awk '{print $NF}' | tr -d '%')
          if awk -v c="$pct" 'BEGIN{exit !(c < 95)}'; then
            echo "::error::statement coverage ${pct}% is below the 95% gate"
            exit 1
          fi
          echo "coverage ${pct}% >= 95%"

      - name: bench (smoke)
        # 冒烟：确保基准能编译、能跑通（bench_test.go 的往返/吞吐基准 +
        # tick_bench_test.go 的扇出对比）。CI 机器性能波动大，不设性能阈值；
        # -benchtime 1x 只跑一轮迭代以免拉长 CI，具体数字请在本机
        # `go test -run '^$' -bench . -benchmem ./` 自行对比。
        run: go test -run '^$' -bench . -benchtime 1x -timeout 5m ./
